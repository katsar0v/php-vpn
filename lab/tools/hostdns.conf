# "Host" resolver of the lab: what the PHP containers (and Docker's embedded
# resolver on their behalf) see.  It must NEVER know the VPN-only names
# (secret.vpn.test): anything under vpn.test gets NXDOMAIN here.
user=root
keep-in-foreground
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
cache-size=0

listen-address=198.51.100.53
bind-interfaces
except-interface=lo

# Logging goes to stderr; /lab/dnsmasq-run.sh timestamps it into state/logs/hostdns.log
log-queries=extra
log-facility=-

# authoritative-style answers, NXDOMAIN for the rest of the lab TLDs
local=/lab.test/
local=/vpn.test/
host-record=echo.lab.test,198.51.100.30
host-record=wg.lab.test,198.51.100.10
host-record=a.lab.test,198.51.100.42
host-record=b.lab.test,198.51.100.42
