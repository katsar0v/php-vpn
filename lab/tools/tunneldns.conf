# DNS served INSIDE the WireGuard tunnel (DNS = 10.13.13.1 in the client confs).
# Listens ONLY on the tunnel address; no upstream (the lab networks are internal).
user=root
keep-in-foreground
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
cache-size=0

listen-address=10.13.13.1
bind-interfaces
except-interface=lo

log-queries=extra
log-facility=-

local=/lab.test/
local=/vpn.test/
host-record=secret.vpn.test,203.0.113.20
host-record=echo.lab.test,198.51.100.30
