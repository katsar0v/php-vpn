# Default vhost: only the health check, everything else 404.
server {
    listen 80 default_server;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}

# a.lab.test -> pool a (poola, php-fpm :9001)
server {
    listen 80;
    server_name a.lab.test;
    root /src/lab/www;
    index index.php;
    location / { try_files $uri =404; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 198.51.100.41:9001;
        fastcgi_read_timeout 120s;
    }
}

# b.lab.test -> pool b (poolb, php-fpm :9002)
