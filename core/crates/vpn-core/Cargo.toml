[package]
name = "vpn-core"
description = "Userspace WireGuard tunnel with an embedded TCP/IP stack, DNS, TLS and HTTP client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-dns", "async", "iface-max-addr-count-4", "dns-max-server-count-4", "dns-max-result-count-8"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
